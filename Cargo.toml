[workspace]
resolver = "2"
members = ["crates/dc-core", "crates/device-connector"]
# Fuzzing (cargo-fuzz, nightly) hat einen eigenen Workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true
