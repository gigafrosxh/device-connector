[package]
name = "device-connector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tray-/Menüleisten-App: Maus, Tastatur, Zwischenablage und Dateien zwischen macOS und Windows teilen"

[dependencies]
dc-core = { path = "../dc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
directories = "5"
arboard = { version = "3", default-features = false }
opener = { version = "0.7", features = ["reveal"] }
rand = "0.8"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"
tao = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_System_ProcessStatus",
  "Win32_Security",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
